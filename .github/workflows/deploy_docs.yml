name: deploy docs
# Builds the documentation site (exports example notebooks, regenerates the API
# reference, builds the Astro site) and publishes docs/dist to the gh-pages branch.
# Mirrors the local `poe deploy_docs` task. Runs on final release tags (vX.Y.Z) and
# on manual dispatch (use dispatch to deploy the current state between releases).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deploy-docs
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: npm ci --prefix docs

      - name: Export example notebooks
        # Executes every notebook to static HTML. OSMnx-based notebooks use the
        # committed ./cache responses; the exporter retries transient OSM rate-limits.
        run: uv run poe export_notebooks --force

      - name: Build the site
        run: uv run poe docs_build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/dist
          publish_branch: gh-pages
          force_orphan: true
